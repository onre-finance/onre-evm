[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# First-party sources pin 0.8.35 in their pragmas. Auto-detection also builds
# the canonical Uniswap v4 PoolManager test fixture with its required 0.8.26.
auto_detect_solc = true
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./script/config" }, { access = "read", path = "./out" }]

[fmt]
# `src/generated` is written by `gemforge build` in Gemforge's own style, and
# `templates` holds a Gemforge template whose `pragma solidity >=__SOLC_VERSION__;`
# placeholder is not parseable Solidity until it is rendered.
# Note: forge 1.5.1 does not match these files with a `dir/**` glob; `dir/*.sol` does.
ignore = ["src/generated/*.sol", "templates/*.sol"]
line_length = 120

[lint]
# `lib/` is excluded by default; tests use Foundry's test_ naming convention.
ignore = ["test/**"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
