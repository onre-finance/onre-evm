# Maven coordinates of the published jar: com.onre.evm:onre-evm-java:<version>.
# Override the version on the command line: ./gradlew build -Pversion=1.2.3
group=com.onre.evm
version=1.0.0-SNAPSHOT

# web3j release used both to generate the wrappers and as the jar's `api` dependency.
# Consumers must run a compatible web3j core; 5.x and 6.x are compiled for Java 21.
web3jVersion=6.0.0
javaRelease=21

# Java package the generated wrappers are placed in.
javaPackage=com.onre.evm

# Set to false to skip running `pnpm build` (Gemforge + Forge) before generating,
# when ../../src/generated/abi.json is already fresh.
forgeBuild=true

org.gradle.parallel=true
